<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login - Campus Café</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/forms.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        ☕ Campus Café
    </div>

</nav>


<main class="form-container">

    <form id="loginForm"
          class="form-card">

        <h1>Welcome Back! 👋</h1>


        <label>
            Email
        </label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter email"
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter password"
        >


        <button type="submit"
                class="btn">

            Login

        </button>


        <p>
            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>
        </p>

    </form>

</main>


<script src="js/auth.js"></script>

</body>
</html>
