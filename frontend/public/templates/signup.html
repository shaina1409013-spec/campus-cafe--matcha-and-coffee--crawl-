<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sign Up - Campus Café</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/forms.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        ☕ Campus Café
    </div>

</nav>


<main class="form-container">

    <form id="signupForm"
          class="form-card">

        <h1>Create Account 📝</h1>


        <label>
            Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter name"
        >


        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter email"
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >


        <label>
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
        >


        <button type="submit"
                class="btn">

            Create Account

        </button>


        <p>
            Already have an account?

            <a href="login.html">
                Login
            </a>
        </p>

    </form>

</main>


<script type="module" src="js/auth.js"></script>

</body>
</html>
