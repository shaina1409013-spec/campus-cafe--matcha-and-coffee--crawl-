<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dashboard - Campus Café</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/navbar.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        ☕ Campus Café
    </div>

    <ul class="nav-links">

        <li>
            <a href="index.html">Home</a>
        </li>

        <li>
            <a href="cafes.html">Cafés</a>
        </li>

        <li>
            <a href="reviews.html">Reviews</a>
        </li>

    </ul>

    <button id="logoutButton" class="nav-btn logout-btn" type="button">Log out</button>

</nav>


<main class="container">

    <h1 class="section-title">
        Welcome, <span id="dashboardName">...</span> 👋
    </h1>

    <p id="dashboardMessage" role="status" aria-live="polite"></p>

    <div id="dashboardContent" class="feature-container" hidden>


        <div class="card">

            <h2>⭐</h2>

            <h3>My Reviews</h3>

            <p>
                5 Reviews
            </p>

        </div>


        <div class="card">

            <h2>❤️</h2>

            <h3>Favourite Cafés</h3>

            <p>
                3 Cafés
            </p>

        </div>


        <div class="card">

            <h2>📍</h2>

            <h3>Visited Cafés</h3>

            <p>
                7 Cafés
            </p>

        </div>


    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
