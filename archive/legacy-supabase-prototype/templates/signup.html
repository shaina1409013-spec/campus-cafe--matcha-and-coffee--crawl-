<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sign Up - Campus Café</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/forms.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        ☕ Campus Café
    </div>

</nav>


<main class="form-container">

    <form id="signupForm"
          class="form-card">

        <h1>Create Account 📝</h1>

        <p id="authMessage" class="auth-message" role="status" aria-live="polite" hidden></p>

        <label>
            Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter name"
            autocomplete="name"
            maxlength="100"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter email"
            autocomplete="email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="new-password"
            minlength="6"
            required
        >


        <label>
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            autocomplete="new-password"
            minlength="6"
            required
        >


        <button type="submit"
                class="btn">

            Create Account

        </button>


        <p>
            Already have an account?

            <a id="loginLink" href="login.html">
                Login
            </a>
        </p>

    </form>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
